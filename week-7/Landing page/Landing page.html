<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>landing page</title>
    <style>
 * { margin: 0; padding: 0; box-sizing: border-box; }
 body { font-family: Arial, sans-serif; color: #12203a; }
 nav {
 display: flex;
 justify-content: space-between;
 align-items: center;
 padding: 19px 25px;
 background: #12203a;
 color: white;
 }
 nav ul { display: flex; gap: 20px; list-style: none; }
 nav a { color: white; text-decoration: none; }
 .btn {
 background: #ffb703;
 border: 0;
 padding: 8px 16px;
 border-radius: 6px;
 font-weight: bold;
 }
 /* Hero: everything in the centre */
 .hero {
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 gap: 12px;
 height: 260px;
 padding: 16px;
 text-align: center;
 background: #5a7ffa;
 color: rgb(255, 254, 254);
 }
 /* Cards: wrap when there is no space */
 .cards { display: flex; flex-wrap: wrap; gap: 16px; padding: 24px; }
 .card {
 flex: 1 1 200px; /* grow, shrink, start at 200px */
 background: #e7f0d3;
 padding: 25px;
 border-radius: 18px;
 text-align: center;
 }
</style>
</head>
<body>
 <nav>
 <h2>CodeLab</h2>
 <ul>
 <li><a href="#">Home</a></li>
 <li><a href="#">Courses</a></li>
 <li><a href="#">Contact</a></li>
 </ul>
 <button class="btn">Sign up</button>
 </nav>
 <section class="hero">
 <h1>Learn Web Development</h1>
 <p>Start from zero. Build real projects.</p>
 <button class="btn">Get Started</button>
 </section>
    <section class="cards">
        <div class="card"><h3>HTML</h3><p>Build the structure</p></div>
 <div class="card"><h3>CSS</h3><p>Make it beautiful</p></div>
 <div class="card"><h3>JavaScript</h3><p>Make it smart</p></div>
 <div class="card"><h3>Git</h3><p>Save your work</p></div>
    </section>
</body>
</html>
