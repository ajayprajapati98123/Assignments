<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coding club</title>
<style>
 /* Variables: change a colour here and it changes everywhere */
 :root {
 --brand: #045c70;
 --light: white;
 --dark: #000001;
 --gap: 16px;
 }

 /* * = every element */

 * { margin: 0; padding: 0; box-sizing: border-box; }
 body {
 font-family: Georgia, serif;
 background: var(--light);
 color: var(--dark);
 line-height: 1.6;
 padding: var(--gap);
 }
 /* h1 = element selector */
 h1 { font-size: 2.2rem; letter-spacing: 1px; }

 /* #hero = id selector (only one on the page) */
 
 #hero {
 background: var(--brand);
 color: white;
 text-align: center;
 padding: 32px var(--gap);
 border-radius: 15px;
 }
 /* .card = class selector (use many times) */
 
 .card {
 background: rgb(217, 240, 211);
 padding: var(--gap);
 margin-top: var(--gap);
 border-radius: 15px;
 }
 table { width: 100%; border-collapse: collapse; margin-top: 8px; }
 th { background: var(--brand); color: rgb(255, 255, 255); text-align: left; }
 th, td { padding: 8px; border-bottom: 1px solid #ccd; }
 input { padding: 5px; margin: 15px 0; }
 button { background: var(--brand); color: rgb(255, 255, 255); border: 0; padding: 15px 20p; border-radius: 6px; font-size:1}
 </style>
 </head>
        
<body>
    <div id="hero"
    <h1><b>Coding Club</b></h1>
    <p>Learn. Build. Share.</p>
</div>



<Div class="card">
    <h2>upcoming events</h2>
    <table>
        <tr> <th> event</th><th> date</th><th>venue</th></tr>
        <tr> <td>HTML Workshop</td><td>12 Nov.</td><td>lab-1</td></tr>
        <tr> <td>Hackthon</td><td>17 Nov.</td><td>Seminar Hall-2</td></tr>

    </table>
</Div>
<div class="card">
    <h2>Register</h2>
<form>
    <p> name: <input type="text" name="name" placeholder="Enter your name"></p>
    <p> Email: <input type="email" name="email" placeholder="You@example.com"> </p>
    <button Type="submit"> Register</button></form> 
</div>
</body>
</html>
